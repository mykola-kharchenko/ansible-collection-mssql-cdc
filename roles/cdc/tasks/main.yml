---
# Shared connection block so each task does not repeat itself.
- name: Fail when required role variables are missing
  ansible.builtin.fail:
    msg: >-
      mssql_cdc_login_user, mssql_cdc_login_password and mssql_cdc_database
      must be set (typically in group_vars + Ansible Vault).
  when: >-
    mssql_cdc_login_user == ''
    or mssql_cdc_login_password == ''
    or mssql_cdc_database == ''
  tags: [always]

- name: Manage database-level CDC
  mykola_kharchenko.mssql_cdc.cdc_db:
    host: "{{ mssql_cdc_host }}"
    port: "{{ mssql_cdc_port }}"
    login_user: "{{ mssql_cdc_login_user }}"
    login_password: "{{ mssql_cdc_login_password }}"
    database: "{{ mssql_cdc_database }}"
    encrypt: "{{ mssql_cdc_encrypt }}"
    trust_server_certificate: "{{ mssql_cdc_trust_server_certificate }}"
    connect_timeout: "{{ mssql_cdc_connect_timeout }}"
    state: "{{ mssql_cdc_state }}"
  tags: [cdc_db, cdc]

- name: Manage capture instances
  mykola_kharchenko.mssql_cdc.cdc_table:
    host: "{{ mssql_cdc_host }}"
    port: "{{ mssql_cdc_port }}"
    login_user: "{{ mssql_cdc_login_user }}"
    login_password: "{{ mssql_cdc_login_password }}"
    database: "{{ mssql_cdc_database }}"
    encrypt: "{{ mssql_cdc_encrypt }}"
    trust_server_certificate: "{{ mssql_cdc_trust_server_certificate }}"
    connect_timeout: "{{ mssql_cdc_connect_timeout }}"
    schema: "{{ item.schema }}"
    name: "{{ item.name }}"
    capture_instance: "{{ item.capture_instance | default(omit) }}"
    captured_columns: "{{ item.captured_columns | default(omit) }}"
    columns: "{{ item.columns | default(omit) }}"
    role_name: "{{ item.role_name | default(mssql_cdc_default_role_name) | default(omit, true) }}"
    supports_net_changes: >-
      {{ item.supports_net_changes | default(mssql_cdc_default_supports_net_changes) }}
    index_name: "{{ item.index_name | default(omit) }}"
    filegroup_name: "{{ item.filegroup_name | default(omit) }}"
    allow_partition_switch: >-
      {{ item.allow_partition_switch | default(mssql_cdc_default_allow_partition_switch) }}
    recreate_strategy: "{{ item.recreate_strategy | default(mssql_cdc_recreate_strategy) }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ mssql_cdc_tables }}"
  loop_control:
    label: "{{ item.schema }}.{{ item.name }} ({{ item.state | default('present') }})"
  register: mssql_cdc_table_results
  when:
    - mssql_cdc_state == 'enabled'
    - mssql_cdc_tables | length > 0
  tags: [cdc_table, cdc]

# DEPRECATED: prefer a `state: absent` entry inside mssql_cdc_tables. This
# separate list is kept for backward compatibility and may be removed in a
# future major version.
- name: Disable capture instances marked for removal (deprecated mssql_cdc_remove)
  mykola_kharchenko.mssql_cdc.cdc_table:
    host: "{{ mssql_cdc_host }}"
    port: "{{ mssql_cdc_port }}"
    login_user: "{{ mssql_cdc_login_user }}"
    login_password: "{{ mssql_cdc_login_password }}"
    database: "{{ mssql_cdc_database }}"
    encrypt: "{{ mssql_cdc_encrypt }}"
    trust_server_certificate: "{{ mssql_cdc_trust_server_certificate }}"
    connect_timeout: "{{ mssql_cdc_connect_timeout }}"
    schema: "{{ item.schema }}"
    name: "{{ item.name }}"
    state: absent
  loop: "{{ mssql_cdc_remove }}"
  loop_control:
    label: "{{ item.schema }}.{{ item.name }}"
  register: mssql_cdc_remove_results
  when: mssql_cdc_remove | length > 0
  tags: [cdc_table, cdc_remove, cdc]

# Aggregate the per-table cdc_table results into a single run summary. The play
# recap's `changed=` is task-level (one looped task = one change however many
# tables moved), so this surfaces the real per-table breakdown. `action` comes
# from the cdc_table return (created/recreated/dropped/unchanged); skipped loop
# items (item-level `when`) are dropped before counting.
- name: Summarize CDC capture-instance changes
  vars:
    _cdc_results: >-
      {{ (mssql_cdc_table_results.results | default([]))
         + (mssql_cdc_remove_results.results | default([])) }}
    _cdc_affected: "{{ _cdc_results | rejectattr('skipped', 'defined') | list }}"
  ansible.builtin.set_fact:
    mssql_cdc_summary:
      evaluated: "{{ _cdc_affected | length }}"
      added: "{{ _cdc_affected | selectattr('action', 'eq', 'created') | list | length }}"
      recreated: "{{ _cdc_affected | selectattr('action', 'eq', 'recreated') | list | length }}"
      dropped: "{{ _cdc_affected | selectattr('action', 'eq', 'dropped') | list | length }}"
      unchanged: "{{ _cdc_affected | selectattr('action', 'eq', 'unchanged') | list | length }}"
  tags: [cdc_table, cdc]

- name: Report CDC capture-instance summary
  ansible.builtin.debug:
    msg: >-
      CDC capture instances — {{ mssql_cdc_summary.evaluated }} evaluated:
      {{ mssql_cdc_summary.added }} added,
      {{ mssql_cdc_summary.recreated }} recreated,
      {{ mssql_cdc_summary.dropped }} dropped,
      {{ mssql_cdc_summary.unchanged }} unchanged
  when: mssql_cdc_summary is defined
  tags: [cdc_table, cdc]

# Surface the counts in the play recap too (default callback shows custom stats).
- name: Record CDC change stats
  ansible.builtin.set_stats:
    data:
      mssql_cdc_added: "{{ mssql_cdc_summary.added | int }}"
      mssql_cdc_recreated: "{{ mssql_cdc_summary.recreated | int }}"
      mssql_cdc_dropped: "{{ mssql_cdc_summary.dropped | int }}"
    per_host: true
    aggregate: false
  when: mssql_cdc_summary is defined
  tags: [cdc_table, cdc]
