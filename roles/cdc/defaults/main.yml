---
# Connection layer — typically set ONCE PER SQL SERVER (a group_vars file for the
# server group), since every database on a host shares it. login_user and
# especially login_password are secrets: keep them in Ansible Vault. database is
# the exception — it is per-database, so set it per host / in a per-database
# group (see roles/cdc/README.md "Secrets & inventory layout").
mssql_cdc_host: "{{ inventory_hostname }}"
mssql_cdc_port: 1433
mssql_cdc_login_user: ""
mssql_cdc_login_password: ""
mssql_cdc_database: ""
mssql_cdc_encrypt: true
mssql_cdc_trust_server_certificate: false
mssql_cdc_connect_timeout: 30

# Database-level CDC flag. Set to 'disabled' to tear it back down (no tables
# will be managed in that case).
mssql_cdc_state: enabled

# Defaults applied to every entry in mssql_cdc_tables that does not override
# them. Mirrors the per-database "defaults" block of the mssqlcdcmgr config.
mssql_cdc_default_role_name: null
mssql_cdc_default_supports_net_changes: true
mssql_cdc_default_allow_partition_switch: true

# Recreate strategy when a table's settings drift.
#   safe   — versioned _vN instance + drop old (no consumer gap)
#   unsafe — disable + enable in place (brief gap)
mssql_cdc_recreate_strategy: safe

# CDC intent — naturally PER DATABASE (set with mssql_cdc_database, in host_vars
# or a per-database group). Desired capture instances. Each entry is a dict:
#   schema:                required
#   name:                  required
#   state:                 optional present|absent (default present); absent
#                          drops the capture instance, tables not listed at all
#                          are left untouched
#   capture_instance:      optional (defaults to <schema>_<name>)
#   captured_columns:      optional list — omit for "capture all columns". Each
#                          entry is a name string or {name, state}; merge-based,
#                          so a column you do not list is left as-is. Mark
#                          {name: X, state: absent} to stop capturing column X.
#   role_name:             optional override of mssql_cdc_default_role_name
#   supports_net_changes:  optional override
#   index_name:            optional
#   filegroup_name:        optional
#   allow_partition_switch: optional override
mssql_cdc_tables: []

# DEPRECATED: prefer a `state: absent` entry in mssql_cdc_tables. Tables to
# explicitly disable (drop the capture instance for); only schema + name are
# read. Kept for backward compatibility.
mssql_cdc_remove: []
