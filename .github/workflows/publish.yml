name: Publish to Ansible Galaxy

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Opt into Node 24 for JavaScript actions ahead of GitHub's June-2026 forced
  # flip. Silences the "Node.js 20 actions are deprecated" warning.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Release gate (sanity + units)
    runs-on: ubuntu-latest
    # Re-verify the tagged commit before we publish, even though main-branch CI
    # already ran on it. Cheap insurance against tagging from a branch or a
    # rebased commit that never went through the full pipeline. One matrix
    # cell (current ansible-core + Python) is enough — the push matrix on the
    # CI workflow is the comprehensive coverage.
    steps:
      - uses: actions/checkout@v4
        with:
          path: ansible_collections/mykola_kharchenko/mssql_cdc

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install "ansible-core>=2.18" pytest pytest-xdist

      - name: ansible-test sanity
        working-directory: ansible_collections/mykola_kharchenko/mssql_cdc
        run: ansible-test sanity --python 3.12 --color -v

      - name: ansible-test units
        working-directory: ansible_collections/mykola_kharchenko/mssql_cdc
        run: ansible-test units --python 3.12 --color -v

  build:
    name: Build collection tarball
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ansible_collections/mykola_kharchenko/mssql_cdc

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install "ansible-core>=2.16"

      - name: Build collection
        working-directory: ansible_collections/mykola_kharchenko/mssql_cdc
        run: ansible-galaxy collection build --output-path dist/

      - name: Upload tarball as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: collection
          path: ansible_collections/mykola_kharchenko/mssql_cdc/dist/*.tar.gz

  publish:
    name: Publish to Ansible Galaxy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ansible-galaxy
      url: https://galaxy.ansible.com/ui/repo/published/mykola_kharchenko/mssql_cdc/
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install "ansible-core>=2.16"

      - name: Download collection tarball
        uses: actions/download-artifact@v4
        with:
          name: collection
          path: dist/

      # Galaxy publishing uses an API key stored as the ANSIBLE_GALAXY_API_KEY
      # secret on the `ansible-galaxy` environment. Generate one at
      # https://galaxy.ansible.com/me/preferences and add it under
      # repo Settings -> Environments -> ansible-galaxy -> Add secret.
      - name: Publish
        env:
          ANSIBLE_GALAXY_API_KEY: ${{ secrets.ANSIBLE_GALAXY_API_KEY }}
        run: |
          if [ -z "$ANSIBLE_GALAXY_API_KEY" ]; then
            echo "::error::ANSIBLE_GALAXY_API_KEY is not set on the 'ansible-galaxy' environment"
            exit 1
          fi
          ansible-galaxy collection publish dist/*.tar.gz --api-key "$ANSIBLE_GALAXY_API_KEY"
