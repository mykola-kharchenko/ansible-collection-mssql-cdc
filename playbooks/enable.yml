---
# Minimal example: enable database-level CDC and capture a couple of tables on
# one database — a first-touch playbook before wiring up inventory.
#
# Keep the password out of your shell history: put it in a vaulted file and pass
# it at run time (do NOT inline it with -e mssql_cdc_login_password=...):
#
#   ansible-vault create secrets.yml     # add: mssql_cdc_login_password: "S3cr3t"
#   ansible-playbook playbooks/enable.yml -e @secrets.yml --ask-vault-pass
#
# Override host / port / login_user / database the same way (-e or a vars file).

- name: Enable CDC on a single database (no inventory required)
  hosts: localhost
  gather_facts: false
  connection: local
  collections: [mykola_kharchenko.mssql_cdc]

  vars:
    mssql_cdc_host: localhost
    mssql_cdc_port: 1433
    mssql_cdc_login_user: sa
    mssql_cdc_database: test_cdc
    mssql_cdc_trust_server_certificate: true
    # mssql_cdc_login_password comes from a vaulted -e @secrets.yml (see header);
    # extra-vars also override any of the connection vars above.

  tasks:
    - name: Enable database-level CDC
      cdc_db:
        host: "{{ mssql_cdc_host }}"
        port: "{{ mssql_cdc_port }}"
        login_user: "{{ mssql_cdc_login_user }}"
        login_password: "{{ mssql_cdc_login_password }}"
        database: "{{ mssql_cdc_database }}"
        trust_server_certificate: "{{ mssql_cdc_trust_server_certificate }}"
        state: enabled

    - name: Capture dbo.orders (all columns)
      cdc_table:
        host: "{{ mssql_cdc_host }}"
        port: "{{ mssql_cdc_port }}"
        login_user: "{{ mssql_cdc_login_user }}"
        login_password: "{{ mssql_cdc_login_password }}"
        database: "{{ mssql_cdc_database }}"
        trust_server_certificate: "{{ mssql_cdc_trust_server_certificate }}"
        schema: dbo
        name: orders

    - name: Capture dbo.customers (id, email only) with a PII role
      cdc_table:
        host: "{{ mssql_cdc_host }}"
        port: "{{ mssql_cdc_port }}"
        login_user: "{{ mssql_cdc_login_user }}"
        login_password: "{{ mssql_cdc_login_password }}"
        database: "{{ mssql_cdc_database }}"
        trust_server_certificate: "{{ mssql_cdc_trust_server_certificate }}"
        schema: dbo
        name: customers
        captured_columns: [id, email]
        role_name: cdc_pii_reader
